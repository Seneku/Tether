name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows is the primary platform (Live Coding, Build.bat); 3.11 is the Python bundled with UE 5.8,
    # which runs the in-editor toolset. Linux and macOS cover the CLI's platform layer.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python: "3.11"}
          - {os: windows-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax check
        run: python -W error -m compileall -q cli Plugins/Tether/Content/Python tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Launcher script
        if: runner.os != 'Windows'
        run: sh bin/ue --help
